<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Migraine Diary</title>
  <meta name="description" content="A private, offline migraine diary that looks for triggers up to three days before an attack. All data stays on this device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Migraine">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a white flash at night.
    (function () {
      try {
        var t = localStorage.getItem('md-theme') || 'auto';
        var hour = new Date().getHours();
        var night = hour >= 20 || hour < 6;
        var dark = t === 'dark' || (t === 'auto' && (night || matchMedia('(prefers-color-scheme: dark)').matches));
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <h1 class="app-title">Migraine Diary</h1>
    <div class="save-indicator" id="save-indicator" role="status" aria-live="polite"></div>
  </header>
  <div id="banners"></div>
  <main id="main" tabindex="-1"></main>
  <nav class="tab-bar" aria-label="Main">
    <a href="#/today" data-tab="today"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 5h16v15H4z M4 9h16 M8 3v4 M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Today</a>
    <a href="#/calendar" data-tab="calendar"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 5h16v15H4z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M7 12h2v2H7z M11 12h2v2h-2z M15 12h2v2h-2z M7 16h2v2H7z M11 16h2v2h-2z" fill="currentColor"/></svg></span>Calendar</a>
    <a href="#/trends" data-tab="trends"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 19h16 M6 15l4-5 4 3 5-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Trends</a>
    <a href="#/triggers" data-tab="triggers"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 18h4v-6H5z M10 18h4V6h-4z M15 18h4v-9h-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>Triggers</a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v3 M12 18v3 M3 12h3 M18 12h3 M5.6 5.6l2.1 2.1 M16.3 16.3l2.1 2.1 M5.6 18.4l2.1-2.1 M16.3 7.7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>Settings</a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
